<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Editing — Quản trị</title>
<style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#fafafa;color:#222;max-width:1000px;margin:32px auto;padding:24px}section{background:white;padding:24px;margin:20px 0;border:1px solid #ddd}h1{font-size:24px}h2{font-size:18px}input,select,textarea,button{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:3px;background:white;color:#222}input,textarea{width:100%}button{cursor:pointer;margin-right:8px}button:hover{background:#eee}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.edit{border-top:1px solid #ddd;padding:16px 0}a{color:inherit}label{display:block}details{margin:12px 0}</style>
<a href="/">Chatbot</a><h1>Knowledge Editing</h1>
<p>Chỉnh sửa tại tầng truy xuất, giữ nguyên dữ liệu CSV và trọng số mô hình. Bản mới được lưu ở trạng thái nháp.</p>
<section><label>Token quản trị (AGENT_ADMIN_TOKEN)<input id="token" type="password" autocomplete="off"></label><button id="load">Tải dữ liệu</button><pre id="metrics"></pre></section>
<section><h2>Tạo bản chỉnh sửa</h2><form id="form">
<input name="product_id" placeholder="Mã sản phẩm từ thẻ hoặc nguồn trích dẫn" required>
<select name="field"><option>price</option><option>currency</option><option>product_name</option><option>description</option><option>brand</option><option>average_rating</option></select>
<textarea name="new_value" placeholder="Giá trị mới" required></textarea>
<input name="reason" placeholder="Lý do chỉnh sửa" required><input name="evidence" placeholder="Nguồn bằng chứng; ghi rõ nếu là dữ liệu giả lập" required>
<button>Tạo bản nháp</button></form><p id="message" role="status"></p></section>
<section><h2>Phiên bản và hoàn tác</h2><div id="edits"></div><h3>Xem trước câu trả lời và thuộc tính</h3><pre id="preview"></pre></section>
<section><h2>Dữ liệu sản phẩm và review</h2><form id="search"><label>Tìm sản phẩm<input id="catalogquery" placeholder="Tên, thương hiệu hoặc thuộc tính"></label><button>Tìm kiếm</button></form><div id="catalog"></div></section><section><h2>Nhật ký Agent</h2><button id="logsload">Tải 50 lượt gần nhất</button><div id="logs"></div></section><script>
const $=id=>document.getElementById(id);
async function api(path,body){const response=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function load(){try{const data=await api('edits');$('edits').replaceChildren();for(const e of data.items){const div=document.createElement('div');div.className='edit';const label=document.createElement('p');label.textContent=`v${e.version} · ${e.product_id} · ${e.field} = ${e.new_value} · ${e.active?'Đang bật':'Đang tắt'} · ${e.reason}`;div.append(label);for(const [title,action] of [['Xem trước','preview'],[e.active?'Hoàn tác / Tắt':'Kích hoạt',e.active?'rollback':'activate']]){const button=document.createElement('button');button.textContent=title;button.onclick=async()=>{try{const result=await api(action,{edit_id:e.edit_id});if(action==='preview')$('preview').textContent=JSON.stringify(result,null,2);else await load()}catch(err){$('message').textContent=err.message}};div.append(button)}$('edits').append(div)}const m=await api('metrics');$('metrics').textContent=`Lượt chat: ${m.total_turns} | Độ trễ trung bình: ${m.mean_latency_ms} ms | p95: ${m.p95_latency_ms} ms | Lỗi: ${m.errors}\nPlanner: ${m.planner}; Qwen/FAISS/BPR chưa được bật.`}catch(err){$('message').textContent=err.message}}
$('load').onclick=load;$('form').onsubmit=async event=>{event.preventDefault();try{await api('edits',Object.fromEntries(new FormData(event.target)));$('message').textContent='Đã tạo bản nháp. Xem trước rồi kích hoạt để áp dụng.';await load()}catch(err){$('message').textContent=err.message}};

$('search').onsubmit=async event=>{event.preventDefault();try{const d=await api('products?q='+encodeURIComponent($('catalogquery').value));$('catalog').replaceChildren();for(const p of d.items){const row=document.createElement('details'),title=document.createElement('summary'),info=document.createElement('pre');title.textContent=p.name+' | '+p.product_id;info.textContent=JSON.stringify(p,null,2);const button=document.createElement('button');button.textContent='Xem review và nguồn';button.onclick=async()=>{try{const r=await fetch('/api/product?id='+encodeURIComponent(p.product_id));info.textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('message').textContent=e.message}};row.append(title,info,button);$('catalog').append(row)}}catch(e){$('message').textContent=e.message}};
$('logsload').onclick=async()=>{try{const d=await api('logs');$('logs').replaceChildren();for(const t of d.items){const row=document.createElement('details'),title=document.createElement('summary'),info=document.createElement('pre');title.textContent=t.created+' | '+t.message;info.textContent=JSON.stringify(t.answer,null,2);row.append(title,info);$('logs').append(row)}}catch(e){$('message').textContent=e.message}};
</script></html>
